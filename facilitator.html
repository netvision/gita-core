<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वक्ता मार्गदर्शिका • गीता और नेतृत्व</title><link rel="stylesheet" href="style.css"><style>body{background:var(--paper)}main{max-width:950px;margin:auto;padding:35px}article{border-top:1px solid var(--line);padding:25px 0;break-inside:avoid}h1{font-size:40px}h2{font-size:28px}h3{margin:18px 0 0;color:var(--saffron);font-size:18px}p{font-size:20px;line-height:1.9}.meta{font-size:15px;color:var(--saffron)}.cue{padding:16px 20px;border-left:3px solid var(--saffron);background:#e8dfca}@media print{@page{size:A4 portrait;margin:18mm}main{padding:0}p{font-size:12pt}h2{font-size:18pt}}</style></head><body><main><h1>वक्ता मार्गदर्शिका</h1><p>गीता और नेतृत्व · 105 मिनट</p><p class="no-print"><a href="index.html">प्रस्तुति</a> &nbsp; <button onclick="print()">प्रिंट</button></p><p>स्पष्टीकरण के प्रश्न साथ-साथ लें। लंबे प्रश्न अंतिम संवाद के लिए रखें। निजी अनुभव साझा करना स्वैच्छिक है। श्लोक और मूल पाठ के कथन को प्रबंधन अनुप्रयोग से अलग स्पष्ट करें।</p><div id="guide"></div></main><script src="slides.js"></script><script>let elapsed=0;document.querySelector('#guide').innerHTML=slides.map((s,i)=>{let start=elapsed;elapsed+=s.time;return `<article><p class="meta">SLIDE ${i+1} · ${s.time} मिनट · सत्र ${start}–${elapsed} मिनट</p><h2>${s.title.replace(/<br>/g,' ')}</h2>${s.verse?`<p>${s.verse}<br><small>${s.ref}</small></p>`:''}<h3>वक्ता के लिए</h3><p class="cue">${s.speakerCue}</p><h3>संचालन संकेत</h3><p>${s.notes}</p><p class="meta">${s.source||'संवाद / कार्यस्थल अनुप्रयोग'}</p></article>`}).join('');</script></body></html>
