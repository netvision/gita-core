        detail: `<h3>विचार का विस्तार</h3><p><button class="verse-trigger" type="button" data-verses="5.19 5.20">भगवद्गीता के अध्याय 5 के श्लोक 19–20 में</button> समभाव और प्रिय-अप्रिय में स्थिरबुद्धि का वर्णन है। “यह हो अथवा न हो”, “यह अच्छा या बुरा”—ऐसे द्वन्द्वों के बीच भी भीतर स्थिरता बनी रह सकती है; निर्दोष दृष्टि से समता सहज होती है।</p><p><button class="verse-trigger" type="button" data-verses="3.27 3.28">भगवद्गीता के अध्याय 3 के श्लोक 27–28 में</button> तथा <button class="verse-trigger" type="button" data-verses="4.18">भगवद्गीता के अध्याय 4 के श्लोक 18 में</button> कर्तापन की मान्यता पर विचार आता है: कर्म प्रकृति के गुणों में होते हैं, पर अहंकार से मोहित व्यक्ति “मैं कर्ता हूँ” मानता है। समत्व निष्क्रियता नहीं; सामने के कार्य को सामर्थ्य के अनुसार पूरा करना भी आवश्यक है।</p><h3>वक्ता के लिए चर्चा-सूत्र</h3><p>समत्व का अर्थ भावना दबाना, अन्याय को अनदेखा करना या समीक्षा रोकना नहीं है। सफलता और असफलता दोनों के बाद तथ्य देखना, सीखना और अगला उचित कर्म करना इसका कार्यस्थल में उपयोगी रूप हो सकता है।</p>`
      },
      {
        title: 'शरणागति', idea: 'एक परम तत्त्व का आश्रय', cue: 'अहंता की पकड़ से मुक्ति', tone: 'turn',
        detail: `<h3>विचार का विस्तार</h3><p><button class="verse-trigger" type="button" data-verses="18.65 18.66">भगवद्गीता के अध्याय 18 के श्लोक 65–66 में</button> श्रीकृष्ण मन, भक्ति और प्रणाम को अपनी ओर लगाने का आह्वान करते हैं और एकमात्र अपनी शरण में आने का वचन देते हैं। शरणागति का केन्द्र परमात्मतत्त्व में दृढ़ निष्ठा और अपनी अहंता की स्वतंत्र सत्ता के आग्रह को छोड़ना है।</p><p>जब विविध पहचान और सम्बन्धों से निजी सुख की अपेक्षा बँधी रहती है, पराश्रय बना रहता है। शरणागति उस अपेक्षा को परम तत्त्व में समर्पित करने की आध्यात्मिक दिशा है।</p><h3>वक्ता के लिए चर्चा-सूत्र</h3><p>इसे किसी प्रबंधक, संस्था या सत्ता के आगे आत्मसमर्पण न बताएं। गीता के “सर्वधर्मान् परित्यज्य” को कर्मचारियों या शिक्षकों के सामान्य कर्तव्य छोड़ने की सलाह न बनाएं; चर्चा अहंता और परम तत्त्व के आध्यात्मिक सम्बन्ध की है।</p>`
      },
      {
        title: 'स्वाश्रय', idea: 'अपने स्वतःसिद्ध स्वरूप में स्थिति', cue: '“है” तत्त्व में स्थिरता', tone: 'destination',
        detail: `<h3>विचार का विस्तार</h3><p>स्वाश्रय की दिशा है—दृश्य जगत के होने या न होने से अपने अस्तित्व का आधार और सुख-दुःख न बाँधना। “मैं हूँ” का स्वतःसिद्ध बोध किसी बाहरी कर्ता या उपकरण पर निर्भर नहीं है।</p><p>इस दिशा की चरम अवस्था अहम्-कृत भाव का पूर्ण त्याग और एक “है” तत्त्व की अखण्ड स्मृति है। <button class="verse-trigger" type="button" data-verses="3.17 3.18">भगवद्गीता के अध्याय 3 के श्लोक 17–18 में</button> आत्मरत / आत्मतृप्त पुरुष का चित्र है, जहाँ निजी प्रयोजन शेष नहीं रहते।</p><h3>वक्ता के लिए चर्चा-सूत्र</h3><p>इस आध्यात्मिक चरम अवस्था को सामान्य प्रबंधकीय निर्देश न बनाएँ। यह नौकरी या जिम्मेदारियाँ छोड़ने की सलाह नहीं; चर्चा उस परम अवस्था की है जिसे यहाँ स्वाश्रय कहा गया है।</p>`
      }
    ];

    const verseTexts = {
      '13.22': 'पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान्।\nकारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु॥',
      '7.4': 'भूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च।\nअहंकार इतीयं मे भिन्ना प्रकृतिरष्टधा॥',
      '7.5': 'अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम्।\nजीवभूतां महाबाहो ययेदं धार्यते जगत्॥',
      '9.12': 'मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः।\nराक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः॥',
      '16.11': 'चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः।\nकामोपभोगपरमा एतावदिति निश्चिताः॥',
      '16.12': 'आशापाशशतैर्बद्धाः कामक्रोधपरायणाः।\nईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान्॥',
      '16.13': 'इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम्।\nइदमस्तीदमपि मे भविष्यति पुनर्धनम्॥',
      '16.14': 'असौ मया हतः शत्रुर्हनिष्ये चापरानपि।\nईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी॥',
      '2.16': 'नासतो विद्यते भावो नाभावो विद्यते सतः।\nउभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः॥',
      '2.17': 'अविनाशि तु तद्विद्धि येन सर्वमिदं ततम्।\nविनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति॥',
      '6.23': 'तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम्।\nस निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा॥',
      '6.24': 'सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः।\nमनसैवेन्द्रियग्रामं विनियम्य समन्ततः॥',
      '6.25': 'शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया।\nआत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्॥',
      '2.39': 'एषा तेऽभिहिता साङ्ख्ये बुद्धिर्योगे त्विमां शृणु।\nबुद्ध्या युक्तो यया पार्थ कर्मबन्धं प्रहास्यसि॥',
      '2.47': 'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥',
      '2.48': 'योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।\nसिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥',
      '5.19': 'इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः।\nनिर्दोषं हि समं ब्रह्म तस्माद् ब्रह्मणि ते स्थिताः॥',
      '5.20': 'न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्।\nस्थिरबुद्धिरसम्मूढो ब्रह्मविद् ब्रह्मणि स्थितः॥',
      '3.27': 'प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः।\nअहङ्कारविमूढात्मा कर्ताहमिति मन्यते॥',
      '3.28': 'तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः।\nगुणा गुणेषु वर्तन्त इति मत्वा न सज्जते॥',
      '4.18': 'कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः।\nस बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥',
      '18.65': 'मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।\nमामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे॥',
      '18.66': 'सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।\nअहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥',
      '3.17': 'यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः।\nआत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते॥',
      '3.18': 'नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन।\nन चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः॥'
    };

    const list = document.querySelector('#journeyCards');
    list.innerHTML = steps.map((step, i) => `
      <li class="journey-item tone-${step.tone}">
        <button class="path-card" type="button" data-step="${i}" aria-haspopup="dialog" aria-label="${String(i + 1).padStart(2, '0')}: ${step.title}. विस्तृत चर्चा खोलें">
          <span class="card-number">${String(i + 1).padStart(2, '0')}</span>
          <span class="card-copy"><strong>${step.title}</strong><span class="card-idea">${step.idea}</span><span class="card-cue"><b>वक्ता संकेत</b>${step.cue}</span></span>
          <span class="card-open" aria-hidden="true">↗</span>
        </button>
      </li>${i < steps.length - 1 ? '<li class="journey-connector" aria-hidden="true"><span>↓</span></li>' : ''}`).join('');

    const dialog = document.querySelector('#stepDialog');
    const dialogTitle = document.querySelector('#dialogTitle');
    const dialogContent = document.querySelector('#dialogContent');
    const verseBubble = document.querySelector('#verseBubble');
    const verseBubbleVerses = document.querySelector('#verseBubbleVerses');
    const verseBubbleClose = document.querySelector('#verseBubbleClose');
    let lastTrigger = null;
    let lastVerseTrigger = null;

    function closeVerseBubble(returnFocus = true) {
      if (verseBubble.hidden) return;
      verseBubble.hidden = true;
      if (lastVerseTrigger) {
        lastVerseTrigger.setAttribute('aria-expanded', 'false');
        if (returnFocus) lastVerseTrigger.focus();
      }
    }

    function openVerseBubble(trigger) {
      const refs = trigger.dataset.verses.split(/\s+/).filter(ref => verseTexts[ref]);
      verseBubbleVerses.replaceChildren(...refs.map(ref => {
        const [chapter, verse] = ref.split('.');
        const entry = document.createElement('section');
        entry.className = 'verse-entry';
        const label = document.createElement('h3');
        label.textContent = `अध्याय ${chapter} · श्लोक ${verse}`;
        const shloka = document.createElement('p');
        shloka.className = 'verse-shloka';
        shloka.textContent = verseTexts[ref];
        entry.append(label, shloka);
        return entry;
      }));
      if (!refs.length) return;

      if (lastVerseTrigger) lastVerseTrigger.setAttribute('aria-expanded', 'false');
      lastVerseTrigger = trigger;
      lastVerseTrigger.setAttribute('aria-expanded', 'true');
      verseBubble.hidden = false;

      const anchor = trigger.getBoundingClientRect();
      const bubble = verseBubble.getBoundingClientRect();
      const gap = 14;
      let top = anchor.bottom + gap;
      if (top + bubble.height > window.innerHeight - gap) top = anchor.top - bubble.height - gap;
      if (top < gap) top = Math.max(gap, (window.innerHeight - bubble.height) / 2);
      const left = Math.max(gap, Math.min(anchor.left, window.innerWidth - bubble.width - gap));
      verseBubble.style.top = `${top}px`;
      verseBubble.style.left = `${left}px`;
      verseBubbleClose.focus({ preventScroll: true });
    }

    list.addEventListener('click', event => {
      const card = event.target.closest('[data-step]');
      if (!card) return;
      const step = steps[Number(card.dataset.step)];
      if (!step) return;
      lastTrigger = card;
      document.querySelector('#dialogStep').textContent = `${String(Number(card.dataset.step) + 1).padStart(2, '0')} / ${String(steps.length).padStart(2, '0')}`;
      dialogTitle.textContent = step.title;
      dialogContent.innerHTML = step.detail;
      dialogContent.querySelectorAll('.verse-trigger').forEach(trigger => {
        trigger.setAttribute('aria-haspopup', 'dialog');
        trigger.setAttribute('aria-expanded', 'false');
      });
      dialog.showModal();
      document.querySelector('#dialogClose').focus();
    });
    dialogContent.addEventListener('click', event => {
      const trigger = event.target.closest('.verse-trigger');
      if (trigger) {
        event.preventDefault();
        openVerseBubble(trigger);
      } else {
        closeVerseBubble(false);
      }
    });
    dialogContent.addEventListener('scroll', () => closeVerseBubble(false));
    verseBubbleClose.addEventListener('click', () => closeVerseBubble());
    dialog.addEventListener('cancel', event => {
      if (!verseBubble.hidden) {
        event.preventDefault();
        closeVerseBubble();
      }
    });
    document.querySelector('#dialogClose').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener('close', () => { closeVerseBubble(false); if (lastTrigger) lastTrigger.focus(); });
  </script>
</body>
