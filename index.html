<!doctype html>
<html lang="hi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>गीता का मुख्य उद्देश्य</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="layouts.css"><link rel="stylesheet" href="presentation.css"></head>
<body>
<header class="toolbar"><a class="brand" href="#1">गीता <span>और नेतृत्व</span></a><nav aria-label="प्रस्तुति नियंत्रण"><button id="map">मुख्य प्रवाह</button><a class="cards-nav" href="flowchart-cards.html">चर्चा कार्ड</a><button id="overview">सभी स्लाइड</button><button id="notes">वक्ता नोट्स</button><button id="fullscreen" title="F">पूर्ण स्क्रीन</button><button id="print">प्रिंट</button></nav></header>
