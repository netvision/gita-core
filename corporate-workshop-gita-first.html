    main{display:grid;place-items:center;padding:clamp(9px,1.7vw,20px);min-height:0}.deck{width:min(100%,calc((100dvh - 145px)*1.7778));aspect-ratio:16/9;position:relative;background:var(--paper);box-shadow:0 24px 70px #14282035;overflow:hidden;isolation:isolate}.page{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateX(1.2%);transition:opacity .35s ease,transform .35s ease,visibility .35s;overflow:hidden}.page.current{visibility:visible;opacity:1;transform:none;z-index:1}.directory,.content-slide{height:100%;padding:clamp(22px,3.2vw,46px);display:grid;grid-template-rows:auto 1fr auto;position:relative;background:var(--paper)}.directory:before,.content-slide:before{content:'';position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse at 94% 5%,#d6ad622d,transparent 34%),linear-gradient(130deg,transparent 70%,#203b2e0b 70%)}.content-slide.dark{background:var(--forest);color:var(--paper)}.content-slide.dark:before{background:radial-gradient(ellipse at 90% 8%,#d6ad6220,transparent 36%),linear-gradient(130deg,transparent 65%,#ffffff06 65%)}

    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
    @media print{html,body{display:block;background:#fff;overflow:visible}.topbar,.bottombar,.notes,dialog,.lens-trigger{display:none!important}main{display:block;padding:0}.deck{width:auto;aspect-ratio:auto;box-shadow:none;overflow:visible}.page,.page.current{position:relative;visibility:visible;opacity:1;transform:none;width:100vw;height:56.25vw;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.content-slide .corporate-lens[hidden]{display:block!important}.page:last-child{page-break-after:auto}}

<body>

      <div class="page-content">
        <div class="index-top"><article class="index-hero"><span class="kicker">मुख्य सूत्र · GITA CONNECTION</span><h1>पर से स्व तक,<br>चाह से कर्मयोग तक।</h1></article><div class="index-meta"><span>संवाद-क्रम चुनें</span><strong>01—13</strong></div></div>

  <script>
    (()=>{
      const slides=[
        {title:'Stress: The Number-One Killer',tag:'पराश्रय से स्वाश्रय',gita:'अपेक्षा और वास्तविकता का अंतर',text:'जो चाहते हैं वह न हो, या जो हो रहा है वह हमारी चाह के विपरीत हो—तब मन व्याकुल होता है। जब सुख-दुःख किसी दृश्य वस्तु के होने या न होने पर निर्भर हों, मन उसी “पर” पर आश्रित हो जाता है।',refs:[],question:'मेरे सुख का आधार अभी किस बाहरी परिणाम पर टिका है?',lensTitle:'Corporate Lens · चर्चा खोलें',points:[['A','Name the stress.','What you want does not happen.'],['B','Notice the mismatch.','What happens is not what you want.'],['C','Find the dependence.','Praise, target, position or another person?']],notes:'तनाव को अपेक्षा और वास्तविकता के अंतर से जोड़ें। 2–3 लोगों से कार्यस्थल का उदाहरण लें। बोर्ड पर दो हिस्से बनाएं: “मेरे कर्म-क्षेत्र में” और “मेरे नियंत्रण से बाहर।” साझा करना संक्षिप्त और स्वैच्छिक रखें।',mins:7},
        {title:'Who Controls Your Mind?',tag:'पराश्रितता की पहचान',gita:'सुख अथवा दुःख का आधार “पर” पर टिकना',text:'बाजार, पद, प्रशंसा, लक्ष्य या किसी दूसरे का व्यवहार—जब इनमें से कोई हमारी भीतरी स्थिरता का आधार बनता है, उसके बदलते ही मन डोलता है। पहले देखना है: मेरा मन किस बाहरी बात पर निर्भर हो गया है?',refs:['13.22'],question:'अगर बाहरी स्थितियाँ रोज बदलें, तो उनसे बँधा मन कितना स्थिर रहेगा?',lensTitle:'Corporate Lens · बाहरी सूची',points:[['A','Market and targets.','Which outcomes are only partly in our control?'],['B','Appraisal and recognition.','Does praise decide whether work feels worthwhile?'],['C','Other people’s behaviour.','What can still be chosen when it changes?']],notes:'बोर्ड पर बाजार, लक्ष्य, पद, प्रशंसा और ग्राहक-प्रतिक्रिया लिखें। पूछें कि क्या पूरी तरह नियंत्रण में है और क्या केवल प्रभावित किया जा सकता है। “दूसरा” कोई एक व्यक्ति नहीं; कोई भी बाहरी वस्तु या परिस्थिति हो सकती है जिस पर सुख-दुःख टिक जाए।',mins:7},
        {title:'What Does Self-Dependence Mean?',tag:'स्वाश्रय',gita:'“मैं हूँ” का बोध बाहरी परिणाम पर निर्भर नहीं',text:'बाहरी परिस्थितियाँ और भूमिकाएँ बदलती रहती हैं। स्वाश्रय का संकेत है कि अपने होने का आधार पद, प्रशंसा या परिणाम से न बाँधें। इसका अर्थ अकेले काम करना नहीं; सहयोग के बीच भी भीतर का आधार पहचानना है।',refs:['3.17','3.18'],question:'क्या पद या उपलब्धि के बिना भी “मैं हूँ” का बोध रहता है?',lensTitle:'Corporate Lens · आत्म-परीक्षण',points:[['A','Notice one habit.','Where do I wait for external validation?'],['B','Separate work from worth.','A result evaluates an outcome, not the whole self.'],['C','Practice interdependence.','Collaborate without outsourcing self-worth.']],notes:'दो मिनट का मौन लेखन दें: किस काम में मैं केवल प्रशंसा मिलने पर सफल महसूस करता/करती हूँ? साझा करना वैकल्पिक है। स्वाश्रय को अलगाव या सहयोग-विरोध के रूप में न रखें। गीता 3.17–18 के आत्मरत और आत्मतृप्त व्यक्ति के चित्र को बाहरी उपलब्धि से स्वतंत्र आधार के संकेत की तरह जोड़ें।',mins:8},
        {title:'The Root Cause: When “I” Takes Over',tag:'अहं और मोह',gita:'बदलती भूमिका को ही “मैं” मान लेने की उलझन',text:'जब भूमिका, विचार या उपलब्धि को ही अपना सम्पूर्ण स्वरूप मान लिया जाता है, तब उनसे जुड़ी चाह और भय मन को बाँधते हैं। असहमति भी अपने अस्तित्व पर चोट जैसी लग सकती है; यहीं से मानसिक दबाव बढ़ता है।',refs:['13.22','9.12'],question:'टकराव विचार पर है—या “मेरी बात को चुनौती कैसे दी?” पर?',lensTitle:'Corporate Lens · अहं की पहचान',points:[['A','“My proposal must win.”','A disagreement starts to feel personal.'],['B','“I deserve this.”','Expectation can turn into entitlement.'],['C','Ask what is being defended.','The task—or an image of the self?']],notes:'पूछें कि तकनीकी असहमति कब व्यक्तिगत अपमान बन जाती है। “EGO = Expectation Greater than Outcome” लिखें तो इसे केवल स्मरण-सूत्र कहें, शब्द की वास्तविक व्युत्पत्ति नहीं। गीता 13.22 में प्रकृति में स्थित पुरुष और गुण-संग का प्रसंग है; हर पेशेवर मतभेद को आध्यात्मिक दोष न कहें।',mins:8},
        {title:'Signs of Illusion: How Desire Escalates',tag:'अध्याय 16 · श्लोक 11–14',gita:'चिंता → आशा के बंधन → अनुचित संचय → अहं की घोषणा',text:'इन श्लोकों में अंतहीन चिंता और भोग-लालसा, आशाओं के बंधन, काम-क्रोध से प्रेरित अनुचित संचय, “आज यह पाया—आगे और पाऊँगा” और “मैं ही समर्थ हूँ” की घोषणा क्रम से सामने आती है।',refs:['16.11','16.12','16.13','16.14'],question:'अधिक पाने की चाह कब चिंता और दूसरों के प्रति विरोध में बदलने लगती है?',lensTitle:'Corporate Lens · लक्ष्य का दबाव',points:[['A','“I want more.”','Every milestone becomes the next baseline.'],['B','“I want it at any cost.”','Short-term gains begin to excuse compromised means.'],['C','“Whoever blocks me is the problem.”','Challenge turns personal; hostility grows.']],notes:'चार श्लोकों को एक बढ़ती प्रवृत्ति की तरह खोलें: चिंता का अंत न होना, भोग को सर्वोच्च मानना, आशाओं से बँधना और अनुचित साधनों से संचय, फिर शक्ति-विजय का अहंकारी दावा। काल्पनिक कार्यस्थलीय उदाहरण लें—तिमाही लक्ष्य के लिए गुणवत्ता घटाने का दबाव। वास्तविक कंपनी पर तथ्यात्मक दावा न करें।',mins:10},
        {title:'Before Stress Kills You, Kill It',tag:'मोह-नाश',gita:'चाह के खिंचाव से अपने वास्तविक आधार की ओर',text:'तनाव से निपटने की दिशा परिस्थिति से भागना नहीं, बल्कि उस मोह को पहचानना है जो पहचान और सुख को बाहरी परिणाम से बाँध देता है। चाह के खिंचाव से हटकर अपने वास्तविक आधार में ठहरें और फिर उचित कर्म चुनें।',refs:['6.23','6.24','6.25'],question:'वास्तविक अमंगल क्या है—और केवल आशंका क्या?',lensTitle:'Corporate Lens · तथ्य और अगला कदम',points:[['A','Name the fear.','What are you afraid a setback will mean?'],['B','Separate fact from imagined verdict.','What is operational risk; what is fear of judgment?'],['C','Choose the next sound action.','Let clarity—not panic—select the means.']],notes:'प्रतिभागियों से कार्य-संबंधी आशंका पर सोचने को कहें; साझा करना वैकल्पिक हो। “डर वास्तविक नहीं” न कहें। पूछें: ठोस परिचालन जोखिम क्या है? कहाँ अपनी छवि या दूसरों की राय का भय जुड़ा है? अगला कदम क्या है? गीता 6.23–25 दुःख-संयोग से वियोग, संकल्पजन्य कामनाओं का त्याग और धैर्यपूर्वक मन को आत्मा में स्थिर करने की दिशा देते हैं।',mins:8},
        {title:'Revisit the Goal: Profit Alone → Excellence',tag:'उद्देश्य की दिशा',gita:'निजी आग्रह से आगे, उचित और उत्कृष्ट कर्म',text:'जब लक्ष्य केवल भोग, संग्रह और सुरक्षा बन जाए, तो सुख परिणाम पर टिक जाता है; परिणाम अनिश्चित होने से चिंता बढ़ती है। कर्मयोग की दिशा में लक्ष्य व्यापक होता है: निजी आग्रह से आगे, उचित और उत्कृष्ट कर्म की ओर।',refs:['2.47','2.50'],question:'टीम का श्रेष्ठ काम किस लक्ष्य को सीधे आगे बढ़ा सकता है?',lensTitle:'Corporate Lens · लक्ष्य को व्यापक करें',points:[['A','Profit matters.','But market and external forces affect the number.'],['B','Focus on what the team can shape.','Quality, process, relationships and learning.'],['C','Widen the purpose.','From a short-term number to durable excellence.']],notes:'लाभ को खारिज न करें। पूछें कि केवल तिमाही लाभ लक्ष्य बनाने से कौन-सा मानसिक दबाव बनता है। टीम किन कर्मों—गुणवत्ता, ग्राहक-समाधान, सीखने—को सीधे प्रभावित कर सकती है? “उत्कृष्टता होगी तो लाभ अपने-आप आएगा” को तथ्य या गारंटी की तरह न रखें।',mins:8},
        {title:'What Is Corporate Excellence?',tag:'कर्म में कौशल',gita:'गुणवत्ता के साथ सीखना और निरंतर सुधार',text:'उत्कृष्टता केवल टिकाऊ उत्पाद नहीं; बदलती ज़रूरत को समझना, उपयोगी समाधान बनाना और गुणवत्ता बचाते हुए नवाचार करते रहना भी है। कर्मयोग कर्म को कौशल और समबुद्धि से करने की दिशा देता है।',refs:['2.50'],question:'किस समस्या का समाधान है—और अगली आवश्यकता क्या हो सकती है?',lensTitle:'Corporate Lens · उत्कृष्टता के आयाम',points:[['A','Build quality into the work.','Product, service and process standards.'],['B','Keep adapting and innovating.','Good quality without renewal can stagnate.'],['C','Include people and environment.','Relationships and responsibility matter.']],notes:'दो काल्पनिक स्थितियाँ दें: अच्छा उत्पाद लेकिन ग्राहक की बदलती जरूरत अनदेखी; या लक्ष्य के लिए गुणवत्ता में कटौती। समूह से दीर्घकालिक जोखिम पूछें। उत्कृष्टता में गुणवत्ता, नवाचार, पर्यावरण-जिम्मेदारी और कर्मचारी-संबंध शामिल करें।',mins:10},
        {title:'From Individual Ego to Shared Purpose',tag:'कर्मयोग · व्यापक हित',gita:'निजी फल से आगे साझा उद्देश्य की सेवा',text:'गीता कर्म को केवल निजी फल के लिए न करने की दिशा देती है। संगठन में इसका प्रयोग साझा उद्देश्य की सेवा के रूप में हो सकता है—और संस्था की जिम्मेदारी है कि वह उचित कार्य-परिवेश और सहयोग दे।',refs:['4.18'],question:'“मैं साझा काम में क्या जोड़ सकता हूँ?”',lensTitle:'Corporate Lens · विभाग से आगे',points:[['A','Where does “my department” win?','Even when the wider organization loses.'],['B','What does the shared goal need?','Bring expertise together across teams.'],['C','Balance contribution and support.','What can I offer—and what must the company enable?']],notes:'जोड़ी में तीन मिनट दें: कोई उदाहरण जहाँ विभागीय लक्ष्य व्यापक उद्देश्य से टकरा सकता है। “Corporate ego” को संगठनात्मक रूपक कहें, शास्त्रीय शब्द नहीं। योगदान को एकतरफा कर्मचारी-त्याग न बनाएं; संस्था का सहयोगी वातावरण भी आवश्यक है।',mins:10},
        {title:'A Corporate Operating System',tag:'विवेक से उचित कर्म',gita:'तथ्य देखना, भेद करना, उचित कदम चुनना',text:'विवेक बदलते और टिकाऊ, उचित और अनुचित का भेद देखने में मदद करता है। ज्ञात असत्य को पकड़े रहना, करने योग्य कर्म से बचना या अनुचित कर्म करना मन और काम दोनों को उलझाता है।',refs:['2.16','2.17','2.47'],question:'तथ्य क्या है, उचित विकल्प क्या है, अगला कर्म क्या है?',lensTitle:'Corporate Lens · निर्णय चक्र',points:[['A','Pause before reacting.','What is verified, and what is assumed?'],['B','Choose means that stand scrutiny.','No falsification, under-billing or hidden quality cuts.'],['C','Align knowledge and action.','Make the next step clear and ethical.']],notes:'बोर्ड पर चक्र बनाएँ: अल्पकालिक समझौता → छिपाना → बढ़ता तनाव → नैतिक संकट। इसे संभावित जोखिम रखें, नियत परिणाम नहीं। प्रतिभागियों से पूछें कि निर्णय से पहले कौन-से तथ्य, नियम और हितधारक देखने चाहिए।',mins:9},
        {title:'Poise Under Pressure',tag:'समत्वं योग उच्यते',gita:'सफलता-असफलता में संतुलन, ताकि उचित कर्म दिखे',text:'समत्व का अर्थ परिस्थिति को महत्वहीन मानना नहीं। सफलता या असफलता में मन को इतना संतुलित रखना कि तथ्य दिखें, विवेक बना रहे और अगला उचित कर्म चुना जा सके।',refs:['5.19','5.20'],question:'कौन-सी प्रतिक्रिया समाधान के रास्ते खोलती है?',lensTitle:'Corporate Lens · संकट अभ्यास',points:[['A','Project fails before launch.','What are the verified facts?'],['B','Assess before reacting.','What resources and choices remain?'],['C','Respond without a cover-up.','Communicate, prioritize and deploy help.']],notes:'स्थिति रखें: लॉन्च से 24 घंटे पहले परियोजना विफल। घबराहट/दोषारोपण की प्रतिक्रिया और वस्तुनिष्ठ आकलन/स्पष्ट सूचना की प्रतिक्रिया की तुलना करें। समत्व को निष्क्रियता न कहें; यह दबाव में निर्णय-क्षमता बनाए रखने का आधार है।',mins:10},
        {title:'Self-Mastery Shapes the Workplace',tag:'आत्म-आधार से कर्म',gita:'आत्मरत और आत्मतृप्त: भीतर से पूर्ण',text:'गीता ऐसे व्यक्ति की बात करती है जो अपने भीतर संतुष्टि का आधार पाता है; उसे अपनी सार्थकता हर बाहरी उपलब्धि से प्रमाणित नहीं करनी पड़ती। भीतर के इस आधार से व्यक्ति साझा काम में अधिक स्पष्टता, समत्व और निष्ठा के साथ योगदान दे सकता है।',refs:['3.17','3.18','4.18'],question:'अपने अगले निर्णय में कौन-सा एक व्यवहार बदल सकता हूँ?',lensTitle:'Corporate Lens · एक संकल्प',points:[['A','One reaction to change.','Where will I pause before responding?'],['B','One standard to protect.','Quality, honesty or respect under pressure.'],['C','One action this week.','Write a first step and a check-in date.']],notes:'हर प्रतिभागी से छोटा, देखने योग्य संकल्प लिखवाएँ—जैसे आलोचना पर जवाब देने से पहले तथ्य जाँचना या लक्ष्य-दबाव में गुणवत्ता जोखिम स्पष्ट करना। साझा करना वैकल्पिक रखें। इसके बाद खुला प्रश्नोत्तर लें।',mins:8},
        {title:'Path to a Stress-Free State',tag:'चुप-साधन · सहज विश्राम',gita:'भीतर का ऐसा आधार, जिसे कोई भी बाह्य परिस्थिति डिगा न सके',text:'तनाव-मुक्ति का मार्ग केवल बाहरी परिस्थितियों को बदलना नहीं, भीतर स्थिरता पाना भी है। चुप-साधन में बाहर और भीतर के आग्रह शांत होते हैं—उठते विचारों को न अपना मानना, न उनसे लड़ना; उनसे संबंध न जोड़ते हुए तटस्थ रहना। धीरे-धीरे मन अपने भीतर स्थिर होता है और इस विराम में स्वाभाविक विश्राम पाता है।',refs:['6.22','6.25'],question:'क्या मैं कुछ क्षण रुककर विचार को देख सकता हूँ—बिना उससे चिपके या उसे दबाए?',lensTitle:'Corporate Lens · विराम से स्पष्टता',points:[['A','Pause before reacting.','Take a moment to notice what is happening within.'],['B','Let thoughts pass.','A thought or fear need not become an instruction.'],['C','Return to the work.','Choose the next appropriate action with clarity.']],notes:'“चुप-साधन” को विचारों को जबरन रोकना न कहें। मूल भाव है—बाहर-भीतर से चुप होना, उठते संकल्पों से अपना संबंध न जोड़ना, न उनसे लड़ना और न उनके साथ बहना। प्रतिभागियों को 20–30 सेकंड का मौन दें; फिर पूछें कि प्रतिक्रिया देने से पहले एक छोटा विराम निर्णय को कैसे बदल सकता है। इसे काम से पलायन नहीं, स्पष्टता के साथ उचित कर्म पर लौटने की तैयारी के रूप में रखें।',mins:7}
      ];
      const verses={
        '2.47':'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥',
        '2.48':'योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।\nसिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥',
        '2.50':'बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते।\nतस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम्॥',
        '3.17':'यस्त्वात्मरतिर् एव स्यादात्मतृप्तश्च मानवः।\nआत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते॥',
        '3.18':'नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन।\nन चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः॥',
        '4.18':'कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः।\nस बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥४-१८॥',
        '5.19':'इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः।\nनिर्दोषं हि समं ब्रह्म तस्माद् ब्रह्मणि ते स्थिताः॥५-१९॥',
        '5.20':'न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्।\nस्थिरबुद्धिरसम्मूढो ब्रह्मविद् ब्रह्मणि स्थितः॥५-२०॥',
        '13.22':'पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान्।\nकारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु॥',
        '9.12':'मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः।\nराक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः॥',
        '16.11':'चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः।\nकामोपभोगपरमा एतावदिति निश्चिताः॥',
        '16.12':'आशापाशशतैर्बद्धाः कामक्रोधपरायणाः।\nईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान्॥',
        '16.13':'इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम्।\nइदमस्तीदमपि मे भविष्यति पुनर्धनम्॥',
        '16.14':'असौ मया हतः शत्रुर्हनिष्ये चापरानपि।\nईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी॥',
        '6.22':'यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः।\nयस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते॥६-२२॥',
        '6.23':'तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम्।\nस निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा॥',
        '6.24':'सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः।\nमनसैवेन्द्रियग्रामं विनियम्य समन्ततः॥',
        '6.25':'शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया।\nआत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्॥',
        '2.16':'नासतो विद्यते भावो नाभावो विद्यते सतः।\nउभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः॥',
        '2.17':'अविनाशि तु तद्विद्धि येन सर्वमिदं ततम्।\nविनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति॥'
      };
      const directory=document.getElementById('directory'),slidesRoot=document.getElementById('slides'),indexGrid=document.getElementById('indexGrid'),panel=document.getElementById('notesPanel'),notesToggle=document.getElementById('notesToggle'),count=document.getElementById('count'),progress=document.getElementById('progressFill');let active=0;
      function verseButtons(refs){return refs.map((ref,i)=>`<button class="verse-button" data-verse="${ref}">${i===0?'अध्याय '+ref.split('.')[0]+' · ':''}श्लोक ${ref.split('.')[1]}</button>`).join('')}
      slides.forEach((s,i)=>{
        const number=String(i+1).padStart(2,'0');
        indexGrid.insertAdjacentHTML('beforeend',`<button class="index-card" type="button" data-open-slide="${i+1}"><span class="index-no">${number}</span><span class="index-title">${s.title}</span><span class="index-arrow">↗</span></button>`);
        const points=s.points.map((p,j)=>`<div class="lens-point"><b>${p[0]}</b><p>${p[1]}<small>${p[2]}</small></p></div>`).join('');
        slidesRoot.insertAdjacentHTML('beforeend',`<section class="page content-slide ${i%3===1?'dark':''}" data-page="${i+1}" aria-label="Slide ${i+1}"><div class="slide-top"><span class="eyebrow">${number} / ${s.tag}</span><span class="timing">${String(s.mins).padStart(2,'0')} MIN</span></div><div class="page-content"><h2 class="slide-title">${s.title}</h2><article class="gita-card" data-number="${number}"><span class="gita-kicker">Gita Connection · ${s.tag}</span><h3 class="gita-heading">${s.gita}</h3><p class="gita-copy">${s.text}</p><div class="verse-list">${verseButtons(s.refs)}</div><p class="gita-question">${s.question}</p></article><button class="lens-trigger" type="button" aria-expanded="false"><span class="plus">+</span><span>Corporate Lens</span></button><section class="corporate-lens" hidden><h3 class="lens-heading">${s.lensTitle}</h3><div class="lens-points">${points}</div></section></div><div class="footer"><span>पहले गीता-विचार · फिर कार्यस्थल पर उसका प्रश्न</span><strong>${number} — 13</strong></div><aside class="note-source" hidden>${s.notes}</aside></section>`);
      });
      const pages=[...document.querySelectorAll('.content-slide')];
      function openNotes(){if(active===0)return;const text=pages[active-1].querySelector('.note-source').textContent;panel.innerHTML=`<h3>चर्चा-सूत्र · ${slides[active-1].mins} मिनट</h3><p>${text}</p>`;panel.classList.add('open');notesToggle.classList.add('active');notesToggle.setAttribute('aria-expanded','true')}
      function closeNotes(){panel.classList.remove('open');notesToggle.classList.remove('active');notesToggle.setAttribute('aria-expanded','false')}
      function show(n){active=Math.max(0,Math.min(slides.length,n));directory.classList.toggle('current',active===0);pages.forEach((p,i)=>{p.classList.toggle('current',i===active-1);const trigger=p.querySelector('.lens-trigger'),lens=p.querySelector('.corporate-lens');if(trigger){trigger.setAttribute('aria-expanded','false');trigger.querySelector('span:last-child').textContent='Corporate Lens';lens.hidden=true}});count.textContent=active===0?'INDEX':String(active).padStart(2,'0')+' / 13';progress.style.width=(active/slides.length*100)+'%';closeNotes();document.title=(active===0?'गीता से कार्य तक':slides[active-1].title)+' · Corporate संवाद'}
      document.getElementById('prev').addEventListener('click',()=>show(active<=1?0:active-1));document.getElementById('next').addEventListener('click',()=>show(active===0?1:active+1));notesToggle.addEventListener('click',()=>panel.classList.contains('open')?closeNotes():openNotes());
      document.addEventListener('click',e=>{const indexButton=e.target.closest('[data-open-slide]');if(indexButton){show(Number(indexButton.dataset.openSlide));return}const lensButton=e.target.closest('.lens-trigger');if(lensButton){const lens=lensButton.nextElementSibling,opening=lens.hidden;lens.hidden=!opening;lensButton.setAttribute('aria-expanded',String(opening));lensButton.querySelector('span:last-child').textContent='Corporate Lens';return}const verseButton=e.target.closest('[data-verse]');if(verseButton){const ref=verseButton.dataset.verse;document.getElementById('verseRef').textContent='अध्याय '+ref.split('.')[0]+' · श्लोक '+ref.split('.')[1];document.getElementById('verseText').textContent=verses[ref]||'';document.getElementById('verseDialog').showModal()}});
      document.getElementById('closeVerse').addEventListener('click',()=>document.getElementById('verseDialog').close());document.getElementById('verseDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
      document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(active===0?1:active+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(active<=1?0:active-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length);else if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey)notesToggle.click();else if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});
      let touchX=null;document.getElementById('deck').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});document.getElementById('deck').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>65)show(active+(dx<0?1:-1));touchX=null},{passive:true});const requestedSlide=location.hash.match(/^#slide-(\d{1,2})$/);show(requestedSlide?Number(requestedSlide[1]):0);
    })();
  </script>
